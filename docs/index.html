olor:white}.hero{background:#e8eddf;border:1px solid #dde4d3;border-radius:12px;padding:32px 34px;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;overflow:hidden}.hero h2{font-size:30px;margin:10px 0}.hero .art{font-size:76px;color:#879870;line-height:1}.hero p{color:#6e7b65;margin-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin-bottom:28px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:23px}.stat .number{font:32px 'Playfair Display',serif;margin:13px 0 8px}.stat small{color:var(--muted)}.label{font-size:12px;color:#697766}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:22px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.link{border:0;background:none;color:var(--green);font-size:12px}.row{display:flex;gap:12px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .grow{flex:1}.row small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;font-size:11px;padding:5px 9px;border-radius:20px;background:#eaf0e2;color:#5c724f}.pill.pending{background:#f6ecda;color:#9b7e43}.pill.declined{background:#f4e1dc;color:#a46759}.progress{height:6px;background:#eceee5;border-radius:9px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;background:#9caf82}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar input{flex:1;min-width:180px}input,select,textarea{border:1px solid #dadfd3;border-radius:5px;background:white;padding:11px;color:var(--ink);width:100%}textarea{min-height:80px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500;padding:15px 12px;border-bottom:1px solid var(--line)}td{padding:17px 12px;border-bottom:1px solid var(--line);font-size:13px}td small{display:block;color:var(--muted);margin-top:4px}.table-wrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:38px 12px;line-height:1.8}.hint{background:#f0f2e8;border-radius:8px;padding:16px;color:#728267;line-height:1.7;font-size:12px;margin-top:20px}.danger{color:#a76455}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--green);font-size:11px}dialog{border:1px solid var(--line);border-radius:14px;width:560px;max-width:94vw;padding:28px;color:var(--ink)}dialog::backdrop{background:#24372d66;backdrop-filter:blur(3px)}form .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}label{font-size:12px;color:#6f7c6d;display:block}label input,label select,label textarea{margin-top:7px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.modal-footer{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:white;padding:14px 22px;border-radius:8px;z-index:9;display:none}.invitation{text-align:center;background:#f0e8dc;border:8px double #b9b99c;padding:60px 28px;margin:15px auto;max-width:580px}.invitation h1{font-size:52px}.invitation p{letter-spacing:2px;line-height:2}.guest{max-width:720px;margin:40px auto;padding:24px}.guest h1{text-align:center}.guest .fields{display:grid;gap:18px}.mobile-brand{display:none}@media(max-width:1000px){main{padding:25px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}aside{width:195px;padding:30px 15px}main{margin-left:195px}}@media(max-width:700px){aside{position:static;width:100%;padding:20px}.tagline,.side-bottom{display:none}.brand{font-size:28px}nav{display:flex;overflow:auto;margin-top:10px}nav button{width:auto;white-space:nowrap;padding:9px}nav button b{display:none}main{margin:0;padding:22px 16px}.top{display:none}h1{font-size:30px}.hero{padding:23px}.hero .art{display:none}.heading{align-items:flex-start}.stats{gap:10px}.stat{padding:17px}.card{padding:17px}form .fields{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{aside,.top,.heading,.toolbar,.button{display:none}main{margin:0}.invitation{break-inside:avoid}}
.inv-studio{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(340px,1.15fr);gap:22px;align-items:start}.inv-controls{position:sticky;top:20px}.inv-ideas{display:flex;flex-wrap:wrap;gap:7px}.inv-ideas button{border:1px solid #dfe4d6;background:#f5f6ee;color:#637657;border-radius:20px;padding:8px 10px;font-size:11px}.inv-details{padding:16px;background:#f5f4ef;border-radius:8px;margin-top:21px}.inv-details small{display:block;margin-top:7px;color:var(--muted);line-height:1.5}.inv-notice{font-size:12px;line-height:1.6;background:#faf1e1;border-radius:7px;padding:12px}.inv-canvas{min-height:450px;background:radial-gradient(#dce1d2 .8px,transparent .8px),#f3f3ec;background-size:18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:8px;padding:30px}.inv-canvas h2{font-size:25px;margin-top:17px}.inv-canvas p{color:var(--muted);line-height:1.8;max-width:370px}.inv-preview-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.inv-preview a{text-decoration:none}.inv-artwork{display:block;width:100%;max-height:700px;object-fit:contain;background:#f3f2eb}.inv-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}.inv-saved{border:1px solid var(--line);border-radius:8px;overflow:hidden}.inv-saved.selected{border-color:#6b8557;box-shadow:0 0 0 1px #6b8557}.inv-select{width:100%;padding:0;background:white;border:0;text-align:left;color:var(--ink)}.inv-select img,.inv-thumb{width:100%;height:185px;object-fit:contain;background:#f1f0e7}.inv-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:35px;color:#9aa68c}.inv-thumb small{font-size:11px;margin-top:12px}.inv-select p{padding:0 12px;line-height:1.6;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.inv-saved-footer{display:flex;justify-content:space-between;align-items:center;padding:9px;color:var(--muted);font-size:11px}.button:disabled{opacity:.55;cursor:wait}.inv-orbit{font-size:65px;color:#92a67f;animation:inv-pulse 2s infinite}@keyframes inv-pulse{50%{opacity:.3;transform:scale(.85)}}@media(prefers-reduced-motion:reduce){.inv-orbit{animation:none}}@media(max-width:1100px){.inv-studio{grid-template-columns:1fr}.inv-controls{position:static}.inv-canvas{min-height:360px}}@media print{body:has(#inv-print) *{visibility:hidden}body:has(#inv-print) #inv-print,body:has(#inv-print) #inv-print *{visibility:visible}#inv-print{position:absolute;inset:0;width:100%;height:100%}.inv-artwork{max-height:100%;height:100%;object-fit:contain}.inv-controls,.inv-gallery,.inv-preview-actions{display:none}}
.org-tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-bottom:20px}.org-tier{text-align:left;color:var(--ink);cursor:pointer;transition:background .15s}.org-tier:hover,.org-tier.chosen{background:#edf1e4;border-color:#9aaf83}.org-tier h3{margin:13px 0 8px;font-size:20px}.org-tier p{font-size:12px;min-height:40px}.org-tier-bottom{display:flex;gap:10px;justify-content:space-between;align-items:center}.org-tier-bottom strong{font-size:22px}.org-tier-bottom strong small{font-size:11px;font-weight:400;color:var(--muted)}.org-tier-bottom .pill{font-size:9px;padding:4px 6px}.org-category-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 24px}.org-category-row .eyebrow{margin-right:5px}#org-selection{margin-left:auto;display:flex;align-items:center;gap:6px}@media(max-width:700px){#org-selection{margin-left:0}.org-tier p{min-height:0}}
</style><link rel="stylesheet" href="./mobile.css"></head><body>
<aside><div class="brand">everafter<span>✳</span></div><div class="tagline">Made for your beginning</div><nav id="nav"></nav><div class="side-bottom"><span class="avatar">♡</span>Your shared beginning<br><p>One beautiful day.<br>A little less to worry about.</p></div></aside>
<main><div class="top"><span class="eyebrow">Your wedding, beautifully together</span><small>✧ &nbsp; A little more love. A little less logistics.</small></div><div id="app"></div></main>
<dialog id="modal"><form id="form"><h2 id="modal-title"></h2><div class="fields" id="fields"></div><div class="modal-footer"><button type="button" class="button" onclick="document.querySelector('dialog').close()">Cancel</button><button class="button primary">Save details</button></div></form></dialog><div id="toast" class="toast" role="status"></div>
<script src="./demo-config.js"></script>
<script src="./checklist-templates.js"></script>
<script src="./demo-api.js"></script>
<script src="./invitation.js"></script>
<script src="./organization.js"></script>
<script src="./contacts.js"></script>
<script src="./mobile.js"></script>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={guests:[],tasks:[],vendors:[],rides:[],settings:[]},page='Overview',query='',filter='All';
const pages={'Overview':'◷','Guests':'♧','Accommodation':'⌂','Transport':'↗','Vendors':'◇','Checklist':'☑','Budget':'₹','Invitation':'♡'};
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
const settings=()=>data.settings[0]||{names:'Your names',date:'',venue:'Your wedding venue',budget:1000000,dress:'Festive attire'};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
async function api(url,method='GET',body){return window.everafterDemoApi(url,method,body)}
async function load(){data=await api('/api/records');selectedGuests=new Set([...selectedGuests].filter(id=>data.guests.some(g=>g.id===id)));render()}
async function save(kind,record){await api('/api/records/'+kind,'POST',record);if(kind==='categories')categoryFilter='All';if(kind==='tiers')tierFilter='All';await load()}
function go(p){page=p;query='';filter='All';render();document.querySelector('main').scrollTop=0}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">The planning studio</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function addButton(kind,label){return `<button class="button primary" onclick="edit('${kind}')">＋ ${label}</button>`}
function empty(t){return `<div class="empty">✧<br>${t}</div>`}
function pill(s){return `<span class="pill ${s==='Pending'||s==='Considering'?'pending':s==='Declined'?'declined':''}">${esc(s||'Pending')}</span>`}
function actions(k,id,extra=''){return `<div class="actions"><button onclick="edit('${k}','${id}')">Edit</button>${extra}<button onclick="del('${k}','${id}')" aria-label="Delete record">×</button></div>`}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>${rows.length?'':empty('Nothing here yet. Add your first details to get started.')}</div>`}
function render(){ $('#nav').innerHTML=Object.entries(pages).map(([p,i])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b>${p}</button>`).join(''); const s=settings(),g=data.guests,v=data.vendors,t=data.tasks;let html='';
if(page==='Overview'){const yes=g.filter(x=>x.rsvp==='Attending').length,done=t.filter(x=>x.done).length;const days=s.date?Math.ceil((new Date(s.date+'T00:00:00')-new Date())/86400000):null;html=heading('A beautiful beginning.','Your people, your plans, your day. All coming together.',`<button class="button" onclick="edit('settings')">Wedding details ↗</button>`)+`<div class="hero"><div><div class="eyebrow">${days===null?'Let the planning begin':days>0?days+' days until your forever':'Your wedding celebration'}</div><h2>${esc(s.names)}</h2><p>${s.date?esc(new Date(s.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})):'Set a date and start your story'} &nbsp; · &nbsp; ${esc(s.venue)}</p></div><div class="art">❧ ♡</div></div><div class="stats">${[['Your guest list',g.length,'People to celebrate with'],['RSVPs received',g.filter(x=>x.rsvp&&x.rsvp!=='Pending').length,yes+' attending'],['Planning progress',t.length?Math.round(done/t.length*100)+'%':'0%',done+' of '+t.length+' tasks complete'],['Budget committed',money(v.reduce((a,x)=>a+Number(x.quote||0),0)),'of '+money(s.budget)+' planned']].map(([l,n,d])=>`<div class="stat"><div class="label">${l}</div><div class="number">${n}</div><small>${d}</small></div>`).join('')}</div><div class="grid"><section class="card"><div class="card-head"><h2>A little closer to “I do”</h2><button class="link" onclick="go('Checklist')">All tasks →</button></div>${t.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4).map(x=>taskRow(x)).join('')||empty('A clear head starts with a checklist.')}<button class="link" onclick="edit('tasks')">＋ Add a task</button></section><section class="card"><div class="card-head"><h2>Guest essentials</h2><button class="link" onclick="go('Guests')">Manage →</button></div>${[['Awaiting an RSVP',g.filter(x=>!x.rsvp||x.rsvp==='Pending').length],['Addresses to collect',g.filter(x=>!x.address).length],['Rooms to assign',g.filter(x=>x.needsHotel&&!x.room).length],['Pickups to confirm',g.filter(x=>x.needsRide&&!x.pickup).length]].map(([l,n])=>`<div class="row"><span class="grow">${l}</span><span class="pill pending">${n}</span></div>`).join('')}<div class="hint">A guest’s private link brings their RSVP, preferences, and confirmed arrangements together.</div></section></div>`;}
if(page==='Guests'){html=guestOrganizationView();}
if(page==='Accommodation'){html=heading('A warm welcome.','Record your bookings and give every guest a place to settle in.')+`<section class="card">${table(['Guest / tier','Needs a room','Hotel','Room',''],g.filter(x=>x.needsHotel||x.hotel).map(x=>`<tr><td>${esc(x.name)}<small>${esc(x.tier)}</small></td><td>${x.needsHotel?'Yes':'No'}</td><td>${esc(x.hotel)||'Unassigned'}</td><td>${esc(x.room)||'—'}</td><td>${actions('guests',x.id)}</td></tr>`))}</section><div class="hint">Add hotel needs in Guests, then enter the confirmed hotel and room. Bookings and payments happen outside this app.</div>`;}
if(page==='Transport'){html=heading('Every arrival, taken care of.','Match arrival requests to your confirmed vehicles.',addButton('rides','Add vehicle'))+`<section class="card"><div class="card-head"><h2>Your vehicles</h2></div>${table(['Vehicle','Driver / contact','Seats','Assigned',''],data.rides.map(x=>{let used=g.filter(a=>a.pickup===x.id).reduce((n,a)=>n+Number(a.passengers||1),0);return `<tr><td>${esc(x.name)}<small>${esc(x.route)}</small></td><td>${esc(x.driver)}<small>${esc(x.phone)}</small></td><td>${esc(x.capacity)}</td><td>${used} / ${esc(x.capacity)}</td><td>${actions('rides',x.id)}</td></tr>`}))}</section><section class="card" style="margin-top:22px"><div class="card-head"><h2>Pickup requests</h2></div>${table(['Guest','Arrival / passengers','Assignment',''],g.filter(x=>x.needsRide).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.arrival)||'Awaiting arrival details'}<small>${esc(x.passengers||1)} passenger(s)</small></td><td>${esc(data.rides.find(r=>r.id===x.pickup)?.name)||'Waiting for assignment'}</td><td><button class="button" onclick="assign('${x.id}')">Assign ride</button></td></tr>`))}</section>`;}
if(page==='Vendors'){html=heading('The people behind the magic.','Keep decisions, commitments, and next steps in one place.',addButton('vendors','Add vendor'))+`<section class="card">${table(['Vendor','Status','Quote / paid','Next action',''],v.map(x=>`<tr><td>${esc(x.name)}<small>${esc(x.category)} · ${esc(x.contact)}</small></td><td>${pill(x.status)}</td><td>${money(x.quote)}<small>${money(x.paid)} paid</small></td><td>${esc(x.next)}<small>${esc(x.due)}</small></td><td>${actions('vendors',x.id)}</td></tr>`))}</section><div class="hint">Record vendor-confirmed lead times and decision criteria in each vendor’s notes. Due dates appear here; external notifications and lead-time research are not connected.</div>`;}
if(page==='Checklist'){html=heading('One thing at a time.','Small steps toward a day you’ll always remember.',`<div class="actions"><button class="button" onclick="edit('settings')">Wedding style</button>${addButton('tasks','Add task')}</div>`)+`<section class="card" style="margin-bottom:20px;background:#eaf0e2"><div class="eyebrow">Your celebration, your way</div><h2 style="margin:10px 0">${esc(s.weddingKind&&s.weddingKind!=='Choose later'?s.weddingKind+' wedding checklist':'Start with your wedding style')}</h2><p class="sub">${s.weddingKind&&s.weddingKind!=='Choose later'?'Your starter tasks are ready. Edit, assign, or remove them to suit your celebration. Tasks from earlier styles stay until you remove them.':'Choose a religion, civil ceremony, interfaith celebration, or custom style in Wedding details. Your basic checklist will be added automatically.'}</p>${s.customs?`<p class="sub">Your customs: ${esc(s.customs)}</p>`:''}<button class="link" onclick="edit('settings')">${s.weddingKind&&s.weddingKind!=='Choose later'?'Update wedding style →':'Choose your wedding style →'}</button></section><section class="card">${t.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(taskRow).join('')||empty('Your plans start here. Add a task and give it an owner.')}</section>`;}
if(page==='Budget'){let total=v.reduce((a,x)=>a+Number(x.quote||0),0),paid=v.reduce((a,x)=>a+Number(x.paid||0),0);html=heading('Room for what matters.','A clear view of your commitments and remaining payments.',`<button class="button" onclick="edit('settings')">Set budget</button>`)+`<div class="stats">${[['Planned',s.budget],['Committed',total],['Paid',paid],['Uncommitted',Number(s.budget)-total]].map(([l,n])=>`<div class="stat"><div class="label">${l}</div><div class="number">${money(n)}</div></div>`).join('')}</div><section class="card">${table(['Vendor','Quoted cost','Paid','Remaining','Due date'],v.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.quote)}</td><td>${money(x.paid)}</td><td>${money(Number(x.quote||0)-Number(x.paid||0))}</td><td>${esc(x.due)||'—'}</td></tr>`))}</section>`;}
if(page==='Invitation'){html=invitationView();}
$('#app').innerHTML=mobileContent(page,html);if(page==='Invitation')initInvitations();}
function taskRow(x){return `<div class="row"><input type="checkbox" style="width:17px" aria-label="Complete ${esc(x.name)}" ${x.done?'checked':''} onchange="toggleTask('${x.id}',this.checked)"><div class="grow" style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.name)}<small>${esc(x.owner||'Unassigned')} · ${esc(x.due||'No due date')}${x.due&&x.due<new Date().toISOString().slice(0,10)&&!x.done?' · Overdue':''}</small></div>${actions('tasks',x.id)}</div>`}
function guestTable(rows){return organizationGuestTable(rows)}
function renderRows(){$('#guest-table').innerHTML=guestTable(organizedGuests());$('#org-selection').innerHTML=selectionToolbar()}

const schemas={categories:[['name','Category name','text',true],['description','Description','textarea']],tiers:[['name','Tier name','text',true],['rank','Priority (1 is highest)','number',true],['description','Who belongs here','textarea'],['hotelSupport','Offer accommodation','check'],['travelSupport','Offer transport support','check']],guests:[['name','Full name','text',true],['phone','Phone'],['email','Email','email'],['category','Relationship category',['']],['side','Wedding side',['','Bride','Groom','Partner 1','Partner 2','Shared']],['tier','Private tier',['']],['rsvp','RSVP',['Pending','Attending','Declined']],['meal','Meal',['Unspecified','Vegetarian','Non-vegetarian','Vegan','Other']],['delivery','Invitation / basket',['Not sent','Invitation sent','Basket sent','Both sent']],['address','Mailing address','textarea'],['needsHotel','Needs accommodation','check'],['needsRide','Needs pickup','check'],['hotel','Confirmed hotel'],['room','Room number'],['arrival','Arrival date, time and location'],['passengers','Passengers','number'],['notes','Private notes','textarea']],tasks:[['name','Task','text',true],['owner','Owner'],['due','Due date','date'],['notes','Notes / dependencies','textarea']],vendors:[['name','Vendor name','text',true],['category','Category'],['contact','Contact'],['status','Status',['Considering','Awaiting confirmation','Confirmed','Declined']],['quote','Quoted cost (INR)','number'],['paid','Paid (INR)','number'],['due','Next deadline / payment date','date'],['next','Next action'],['notes','Decision criteria / confirmed lead time','textarea']],rides:[['name','Vehicle / pickup label','text',true],['driver','Driver name'],['phone','Driver contact'],['capacity','Passenger capacity','number',true],['route','Route, pickup date and time']],settings:[['weddingKind','Religion / wedding style',['Choose later','Civil / secular','Hindu','Muslim / Nikah','Christian','Sikh / Anand Karaj','Jewish','Buddhist','Jain','Interfaith / multicultural','Custom ceremony']],['customs','Additional customs or wedding style','textarea'],['names','Couple’s names','text',true],['date','Wedding date','date'],['venue','Venue'],['time','Ceremony time'],['dress','Dress code'],['budget','Total budget (INR)','number']]};
function fields(schema,record){return schema.map(([key,label,type='text',required])=>`<label class="${type==='textarea'?'wide':''} ${type==='check'?'check':''}">${type==='check'?`<input name="${key}" type="checkbox" ${record[key]?'checked':''}>${label}`:`${label}${Array.isArray(type)?`<select name="${key}">${type.map(v=>`<option ${record[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(record[key])}</textarea>`:`<input name="${key}" type="${type}" ${type==='number'?'min="0" step="1"':''} ${required?'required':''} value="${esc(record[key])}">`}`}</label>`).join('')}
function edit(kind,id){$('#form button[type="submit"], #form button:not([type])').textContent='Save details';if(kind==='guests'){schemas.guests.find(f=>f[0]==='category')[2]=['',...groupList('categories').map(g=>g.name)];schemas.guests.find(f=>f[0]==='tier')[2]=['',...groupList('tiers').map(g=>g.name)];}const old=kind==='settings'?settings():data[kind].find(x=>x.id===id)||{};$('#modal-title').textContent=kind==='settings'?'Your wedding details':(id?'Edit ':'Add ')+({guests:'guest',tasks:'task',vendors:'vendor',rides:'vehicle',categories:'category',tiers:'tier'}[kind]);$('#fields').innerHTML=fields(schemas[kind],old)+(kind==='settings'?'<div class="wide hint">Choose a wedding style to automatically add an editable starter checklist. Changing styles adds suggestions and keeps existing tasks. Dates are suggested planning targets based on the wedding date when added; you can change them. Customs vary—keep only what fits your celebration.</div>':'');$('#form').onsubmit=async e=>{e.preventDefault();const record={...old},fd=new FormData(e.target);for(const [key,,type]of schemas[kind])record[key]=type==='check'?fd.has(key):type==='number'?Number(fd.get(key)):fd.get(key);try{if(kind==='guests'&&record.categoryReview==='suggested')record.categoryReview='confirmed';if(kind==='rides'&&record.capacity<1)throw Error('A vehicle needs at least one seat.');await save(kind,record);$('#modal').close();toast(kind==='settings'?'Wedding details and starter checklist saved':'Details saved')}catch(e){toast(e.message)}};$('#modal').showModal()}
async function toggleTask(id,done){try{await save('tasks',{...data.tasks.find(x=>x.id===id),done})}catch(e){toast(e.message)}}
async function del(kind,id){if(!confirm('Delete this record?'))return;try{if(kind==='rides'&&data.guests.some(g=>g.pickup===id))throw Error('Reassign guests before deleting this vehicle.');await api('/api/records/'+kind+'/'+id,'DELETE');await load()}catch(e){toast(e.message)}}
async function copyLink(){toast('Private guest links need the Rust server and are unavailable in this browser-only demo.')}
function assign(id){const g=data.guests.find(x=>x.id===id);$('#modal-title').textContent='Assign a confirmed pickup';$('#fields').innerHTML=`<label class="wide">Vehicle<select name="pickup"><option value="">Waiting / unassigned</option>${data.rides.map(r=>`<option value="${r.id}" ${g.pickup===r.id?'selected':''}>${esc(r.name)} · ${esc(r.route)} · ${esc(r.capacity)} seats</option>`).join('')}</select></label>`;$('#form').onsubmit=async e=>{e.preventDefault();try{const id=new FormData(e.target).get('pickup'),r=data.rides.find(x=>x.id===id);if(r){const used=data.guests.filter(x=>x.id!==g.id&&x.pickup===id).reduce((a,x)=>a+Number(x.passengers||1),0);if(used+Number(g.passengers||1)>Number(r.capacity))throw Error('This vehicle does not have enough seats.');}await save('guests',{...g,pickup:id,driver:r?`${r.driver||''} ${r.phone||''} · ${r.route||''}`:''});$('#modal').close();toast('Pickup assignment saved')}catch(e){toast(e.message)}};$('#modal').showModal()}
function parseCSV(text){const rows=[];let row=[],value='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){value+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}if(quote)throw Error('Unclosed quote in CSV');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importGuests(file){if(!file)return;try{const rows=parseCSV((await file.text()).replace(/^\uFEFF/,'')),head=rows.shift()?.map(x=>x.trim().toLowerCase());if(!head?.includes('name'))throw Error('CSV needs a name column.');let n=0;for(const row of rows){let record={rsvp:'Pending'};head.forEach((key,i)=>{if(['name','phone','email','tier','category','side'].includes(key))record[key]=row[i]||''});if(record.name?.trim()){await api('/api/records/guests','POST',record);n++}}await load();toast(n+' guests imported')}catch(e){await load();toast(e.message)}}
function exportGuests(){const keys=['name','phone','email','category','side','tier','rsvp','meal','address','hotel','room','delivery'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const text=[keys.join(','),...data.guests.map(g=>keys.map(k=>cell(g[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv'}));a.download='wedding-guests.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function guestPage(token){document.querySelector('aside').remove();document.querySelector('main').style.display='none';const root=document.createElement('div');root.className='guest';document.body.append(root);try{const g=await api('/api/guest/'+token);root.innerHTML=`<div class="eyebrow" style="text-align:center">Everafter · You’re part of our story</div><h1>We can’t wait to see you,<br>${esc(g.name)}.</h1><p class="sub" style="text-align:center">Your RSVP and the details for a comfortable celebration.</p><section class="card"><h2>Your arrangements</h2><p>Hotel: ${esc(g.hotel)||'Details to follow'} · Room: ${esc(g.room)||'To be assigned'}</p><p>Pickup: ${esc(g.driver)||'No confirmed pickup yet'}</p></section><form id="guest-form" class="card" style="margin-top:20px"><h2>A few details from you</h2><div class="fields" style="margin:22px 0">${fields([['rsvp','Will you join us?',['Pending','Attending','Declined']],['meal','Meal preference',['Unspecified','Vegetarian','Non-vegetarian','Vegan','Other']],['address','Mailing address (optional)','textarea'],['needsHotel','I need accommodation','check'],['needsRide','I need a pickup','check'],['arrival','Arrival date, time and airport / station'],['passengers','Passengers','number']],g)}</div><button class="button primary">Save my response</button><p class="sub">Your hosts can view these details. Keep this private link to yourself.</p></form>`;$('#guest-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),body=Object.fromEntries(fd);body.needsHotel=fd.has('needsHotel');body.needsRide=fd.has('needsRide');try{await api('/api/guest/'+token,'POST',body);toast('Thank you! Your response has been saved.')}catch(e){toast(e.message)}}}catch(e){root.textContent=e.message}}
if(location.pathname.startsWith('/guest/'))guestPage(location.pathname.split('/')[2]);else load().catch(e=>{$('#app').innerHTML=empty('Could not connect to the Rust server. '+esc(e.message))});
</script></body></html>
