[package]
name = "everafter-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "everafter_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "everafter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
everafter = { path = ".." }
tokio = { version = "1", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
