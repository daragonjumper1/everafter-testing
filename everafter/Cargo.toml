[package]
name = "everafter"
version = "0.1.0"
edition = "2021"
default-run = "everafter"

[[bin]]
name = "export-demo-checklists"
path = "tools/export_demo_checklists.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

